# =============================================================================
#  oscam.conf  --  glowna konfiguracja serwera OSCam
# -----------------------------------------------------------------------------
#  Szablon produkcyjny. Wartosci oznaczone jako <ZMIEN_...> MUSZA zostac
#  uzupelnione przed uruchomieniem. Nie commituj tego pliku z prawdziwymi
#  haslami / kluczami do repozytorium publicznego.
#
#  Dokumentacja skladni: https://wiki.streamboard.tv/wiki/OSCam/config/oscam.conf
# =============================================================================

[global]
# Priorytet procesu (-20..19). Ujemny = wyzszy priorytet CPU.
nice                          = -1
# Rozmiar bufora logow w KiB (rotacja przez logfile/maxlogsize).
maxlogsize                    = 2048
# Zawsze najpierw uzywaj lokalnej karty, dopiero potem peerow.
preferlocalcards              = 1
# Zapisuj historie initow czytnikow (przydatne w webif).
saveinithistory               = 1
# Czas (s) po ktorym nieaktywny klient jest rozlaczany.
clienttimeout                 = 15
# Limit czasu (ms) na odpowiedz od czytnika/peera.
cwtimeout                     = 2500
# Failban: liczba nieudanych logowan zanim IP zostanie zablokowane.
failbantime                   = 30
failbancount                  = 3
# Loadbalancing: 1 = najszybszy czytnik, 2 = najmniejsze obciazenie.
lb_mode                       = 1
lb_save                       = 100
# Domyslny plik logow (mozna tez uzyc "syslog" lub "stdout").
logfile                       = /var/log/oscam/oscam.log
# Poziom logow: 0=off, 1..3 = szczegoly, 255 = debug (nie na produkcji).
loghistorysize                = 4096

[cache]
# Cache CW (control words) - ogranicza podwojne odpytywanie karty.
delay                         = 0
max_time                      = 15
cacheex_wait_time             = 50

# -----------------------------------------------------------------------------
#  DVBAPI - obsluga lokalnego dekodera (softcam na tym samym hoscie)
# -----------------------------------------------------------------------------
[dvbapi]
enabled                       = 1
# Automatyczna aktualizacja EMM na karcie.
au                            = 1
# Tryb PMT (6 = uniwersalny dla wiekszosci enigma2/tvheadend).
pmt_mode                      = 6
request_mode                  = 1
# Uzytkownik z oscam.user uzywany przez lokalny dekoder.
user                          = local
# Typ dekodera: dreambox / dbox2 / duckbox / ipbox / pc / pc-nodmx
boxtype                       = pc

# -----------------------------------------------------------------------------
#  Interfejs WWW (webif) - PANEL ZARZADZANIA
#  Prefix "+" przy porcie = wymuszenie TLS/HTTPS (zalecane!).
# -----------------------------------------------------------------------------
[webif]
httpport                      = +8888
httpuser                      = admin
# ZMIEN NA SILNE HASLO. Generacja: `openssl rand -base64 24`
httppwd                       = <ZMIEN_HASLO_WEBIF>
httprefresh                   = 10
# Whitelist IP majacych dostep do panelu (tylko LAN + localhost).
httpallowed                   = 127.0.0.1,::1,192.168.0.0-192.168.255.255
# Wymuszaj HTTPS (dziala razem z prefixem "+" przy porcie).
httpforcesslv3                = 0
# Certyfikat TLS (jesli pusty, OSCam wygeneruje self-signed przy starcie).
# httpcert                    = /etc/oscam/oscam.pem
httphelplang                  = en
# Ukryj wrazliwe dane w panelu przed zwyklym podgladem.
httphideidleclients           = 1

# -----------------------------------------------------------------------------
#  Monitor (telnet-like) - domyslnie tylko localhost, bez szyfrowania.
#  Jesli nieuzywany, zostaw zakomentowany caly blok.
# -----------------------------------------------------------------------------
[monitor]
port                          = 988
nocrypt                       = 127.0.0.1,::1
aulow                         = 120
hideclient_to                 = 15

# -----------------------------------------------------------------------------
#  Anti-cascading - ochrona przed nadmiernym wspoldzieleniem.
# -----------------------------------------------------------------------------
[anticasc]
enabled                       = 1
numusers                      = 2
# Okno czasowe (min) do liczenia ECM.
samples                       = 10
sampletime                    = 2
# Akcja przy przekroczeniu: 0=log, 1=fake CW, 2=ban.
penalty                       = 1

# -----------------------------------------------------------------------------
#  Protokol CCcam (klienci lacza sie po CCcam). Odkomentuj jesli potrzebny.
#  Uwaga: reshare > 0 udostepnia karte dalej - ustawiaj swiadomie.
# -----------------------------------------------------------------------------
#[cccam]
#port                          = 12000
#version                       = 2.3.0
#reshare                       = 0
#nodeid                        =
#stealth                       = 1

# -----------------------------------------------------------------------------
#  Protokol Newcamd (klienci mag250/enigma). Odkomentuj jesli potrzebny.
#  Klucz DES (28 znakow hex) musi byc identyczny po stronie klienta.
# -----------------------------------------------------------------------------
#[newcamd]
#port                          = 15000@0100:000000
#key                           = 0102030405060708091011121314
#keepalive                     = 1
